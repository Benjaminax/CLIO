version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build: .
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info

volumes:
  redis_data:
